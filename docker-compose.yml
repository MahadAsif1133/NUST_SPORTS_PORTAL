version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nust_sports_db
    environment:
      POSTGRES_DB: nust_sports
      POSTGRES_USER: nust_admin
      POSTGRES_PASSWORD: nust_dev_password_2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nust_admin -d nust_sports"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
